name: AI Blogger Publisher (Gemini Free)

on:
  schedule:
    # يعمل 3 مرات يومياً: الساعة 8 صباحاً، 4 عصراً، و 12 منتصف الليل (بتوقيت UTC)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # زر التشغيل اليدوي من GitHub Actions

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        # تم استبدال مكتبة openai/groq بمكتبة google-generative-ai
        run: |
          npm install @google/generative-ai googleapis google-trends-api dotenv

      - name: Run Publisher Script
        run: node index.js
        env:
          # تأكد من إضافة هذه الأسرار (Secrets) في إعدادات المستودع على GitHub
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
