name: AI Publisher (DeepSeek Edition)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:           # زر التشغيل اليدوي

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # تم استبدال groq-sdk بـ openai
        run: |
          npm install openai googleapis google-trends-api dotenv

      - name: Run publisher
        run: node index.js
        env:
          # تأكد من إضافة هذا السر في إعدادات GitHub بنفس الاسم
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} 
          BLOG_ID: ${{ secrets.BLOG_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
